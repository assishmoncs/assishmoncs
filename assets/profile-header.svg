<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Assish - Software Developer</title>
  <desc id="desc">A dark developer profile banner for Assish, Computer Science student and software developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="65%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="-10" r="180" fill="#58a6ff" opacity="0.07"/>
  <circle cx="1120" cy="250" r="150" fill="#7ee787" opacity="0.05"/>
  <path d="M40 220 C250 180 380 250 540 205 S860 155 1160 205" fill="none" stroke="#58a6ff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M70 235 C260 200 430 260 590 220 S900 170 1130 220" fill="none" stroke="#7ee787" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="72" y="192" width="1056" height="2" fill="url(#accent)"/>
  <text x="72" y="118" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="1">ASSISH</text>
  <text x="74" y="157" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Computer Science Student · Software Developer · Builder</text>
  <g transform="translate(885 82)" fill="none" stroke="#58a6ff" stroke-width="3" opacity="0.9" filter="url(#glow)">
