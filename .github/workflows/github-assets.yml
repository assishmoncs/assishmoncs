name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    paths-ignore:
      - "assets/github-stats.svg"
      - "assets/top-langs.svg"
      - "assets/activity.svg"
      - "assets/streak.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_github_assets.py

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/activity.svg assets/streak.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub profile assets"
          git push
